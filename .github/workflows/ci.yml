name: EcoLogistics CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Configuración global para que NPM busque los archivos dentro de la carpeta correcta
defaults:
  run:
    working-directory: ./backend  # CAMBIA ESTO si tu carpeta se llama de otra forma

jobs:
  # 1. LINT: Comprobar estilo
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # Evita que un espacio extra detenga todo el proyecto

  # 2. TEST: Unitarios e Integración
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run Tests with Coverage
        run: npm test -- --coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: backend/coverage/ # Ajustado a la subcarpeta

  # 3. SONAR: Calidad de código
  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 4. SECURITY SCAN: DAST
  security-scan:
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'https://staging.ecologistics.com'
      - name: Upload ZAP Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: 'report_html.html'

  # 5. PERFORMANCE: Pruebas con k6
  performance-smoke:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 performance test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ci/performance-test.js

  # 6. BUILD: Docker (Aquí volvemos a la raíz para el Dockerfile)
  build:
    needs: performance-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # El Dockerfile suele estar en la raíz
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t ecologistics:latest .

  # 7. DEPLOY: Publicar y Desplegar
publish-deploy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # <--- Agrega esto aquí
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: bash ./ci/deploy-staging.sh
      - name: Production Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: Acaballero11 # Actualizado a tu usuario actual
