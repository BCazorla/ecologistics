# Usa el nombre exacto de tu proyecto en SonarCloud
sonar.projectKey=Acaballero11_ecologistics
# La organización suele ser tu nombre de usuario en minúsculas
sonar.organization=acaballero11

# IMPORTANTE: Si tu código está en la carpeta backend, cámbialo aquí
sonar.sources=.
sonar.tests=test
# Ruta al reporte de cobertura dentro de la carpeta backend
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Umbrales obligatorios
# Sugerencia: ponlo en false para la entrega si no quieres que el pipeline
# se detenga si la nota de calidad es baja.
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=300